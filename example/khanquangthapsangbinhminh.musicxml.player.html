tSegment = []; } } } if (currentSegment.length > 0) { segments.push(currentSegment); } let pathD = ""; for (const seg of segments) { if (seg.length < 2) continue; pathD += "M " + seg[0].x.toFixed(3) + " " + seg[0].y.toFixed(3); for (let i = 0;i < seg.length - 1; i++) { const p0 = seg[i]; const p1 = seg[i + 1]; const cp1x = p0.x + (p1.x - p0.x) / 3; const cp2x = p1.x - (p1.x - p0.x) / 3; pathD += " C " + cp1x.toFixed(3) + " " + p0.y.toFixed(3) + " " + cp2x.toFixed(3) + " " + p1.y.toFixed(3) + " " + p1.x.toFixed(3) + " " + p1.y.toFixed(3); } } if (pathD) { const g = document.createElementNS("http://www.w3.org/2000/svg", "g"); g.setAttribute("id", "f0-actual-layer"); const path = document.createElementNS("http://www.w3.org/2000/svg", "path"); path.setAttribute("d", pathD); g.appendChild(path); const cursorEl = document.getElementById("cursor"); if (cursorEl) { svg.insertBefore(g, cursorEl); } else { svg.appendChild(g); } } } catch (err) { console.error("Error loading actual F0:", err); }
